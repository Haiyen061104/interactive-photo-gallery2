<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>My Interactive Photo Gallery</h1>

    <div id="image">
        Hover over or focus on an image below to display here.
    </div>

    <div class="gallery">
        <img class="preview" src="https://picsum.photos/id/1015/300/200" alt="Beautiful mountain landscape"
            tabindex="0">
        <img class="preview" src="https://picsum.photos/id/1025/300/200" alt="A lovely dog" tabindex="0">
        <img class="preview" src="https://picsum.photos/id/1035/300/200" alt="Scenic waterfall" tabindex="0">
        <img class="preview" src="https://picsum.photos/id/1043/300/200" alt="Nature and mountains" tabindex="0">
        <img class="preview" src="https://picsum.photos/id/1050/300/200" alt="Beautiful scenery" tabindex="0">
        <img class="preview" src="https://picsum.photos/id/1069/300/200" alt="Nature photography" tabindex="0">
    </div>

    <script src="script.js"></script>
</body>

</html>
